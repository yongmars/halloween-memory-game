<!doctype html>
<html lang="ja" data-image-base="./image/">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halloween Memory</title>
  <meta name="description" content="ノクトたちのハロウィン神経衰弱。8ペアをそろえて遊んでみてね！">
  <link rel="canonical" href="https://yongmars.github.io/halloween-memory-game/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:site_name" content="Halloween Memory">
  <meta property="og:title" content="Halloween Memory">
  <meta property="og:description" content="ノクトたちのハロウィン神経衰弱。8ペアをそろえて遊んでみてね！">
  <meta property="og:url" content="https://yongmars.github.io/halloween-memory-game/">
  <meta property="og:image" content="https://yongmars.github.io/halloween-memory-game/image/ec_preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="349">
  <meta property="og:image:height" content="516">
  <meta property="og:image:alt" content="Halloween Memoryの16枚のハロウィンカード">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Halloween Memory">
  <meta name="twitter:description" content="ノクトたちのハロウィン神経衰弱。8ペアをそろえて遊んでみてね！">
  <meta name="twitter:image" content="https://yongmars.github.io/halloween-memory-game/image/ec_preview.png">
  <meta name="twitter:image:alt" content="Halloween Memoryの16枚のハロウィンカード">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="halloween-game" aria-labelledby="game-title">
    <header class="game-header">
      <p class="eyebrow">YONGMARS LIBRARY</p>
      <h1 id="game-title">Halloween <span>Memory</span></h1>
      <p class="instructions">カードをめくって、同じ絵柄を見つけよう</p>
      <p class="progress"><span id="pair-count">0</span> / 8 <span class="progress-label">ペア</span></p>
    </header>
    <div id="card-board" class="card-board" aria-label="神経衰弱のカード16枚"></div>
    <p id="game-status" class="game-status" role="status" aria-live="polite">好きなカードを2枚めくってね</p>
    <section id="celebration" class="celebration" aria-labelledby="clear-title" hidden>
      <p class="clear-decoration" aria-hidden="true">✦ 🎃 ✦</p>
      <h2 id="clear-title" tabindex="-1">🎃 Happy Halloween! 🎃</h2>
      <p>全部そろったね！</p>
      <button id="play-again" class="play-again" type="button">もう一度あそぶ <span aria-hidden="true">↻</span></button>
    </section>
    <footer class="game-footer">✧ Trick or treat, match & repeat ✧</footer>
    <div id="confetti" class="confetti" aria-hidden="true"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
